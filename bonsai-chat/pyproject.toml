[project]
name = "bonsai-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arno Schutijzer", email = "arno.schutijzer@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.6.3",
    "numpy>=2.0",
    "pillow>=10.0",
    "tokenizers>=0.21",
    "transformers==5.5.0",
]

[project.scripts]
bonsai-chat = "bonsai_chat:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
